<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0f172a"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="68%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7f3ff"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" rx="90" fill="url(#bgA)"/>
  <circle cx="250" cy="190" r="230" fill="url(#glowA)"/>

  <circle cx="250" cy="250" r="175" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="250" cy="250" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="6 10"/>

  <!-- certificate ribbon tails -->
  <path d="M 200 250 L 185 340 L 220 318 L 250 345 L 280 318 L 315 340 L 300 250 Z" fill="#083344" fill-opacity="0.55"/>

  <!-- certificate medallion -->
  <circle cx="250" cy="225" r="85" fill="url(#ribbon)"/>
  <circle cx="250" cy="225" r="85" fill="none" stroke="#0f172a" stroke-opacity="0.12" stroke-width="4"/>

  <!-- clock face (the "Watch" in CertWatch) -->
  <circle cx="250" cy="225" r="58" fill="none" stroke="#0284c7" stroke-width="7"/>
  <circle cx="250" cy="225" r="5" fill="#06b6d4"/>
  <!-- hour hand -->
  <line x1="250" y1="225" x2="250" y2="190" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
  <!-- minute hand pointing like a checkmark-ish sweep -->
  <line x1="250" y1="225" x2="278" y2="225" stroke="#06b6d4" stroke-width="7" stroke-linecap="round"/>
  <!-- tick marks -->
  <g stroke="#0f172a" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
    <line x1="250" y1="172" x2="250" y2="180"/>
    <line x1="250" y1="270" x2="250" y2="278"/>
    <line x1="197" y1="225" x2="205" y2="225"/>
    <line x1="295" y1="225" x2="303" y2="225"/>
  </g>

  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 70 110 L 70 80 L 100 80"/>
    <path d="M 430 110 L 430 80 L 400 80"/>
    <path d="M 70 390 L 70 420 L 100 420"/>
    <path d="M 430 390 L 430 420 L 400 420"/>
  </g>
</svg>
